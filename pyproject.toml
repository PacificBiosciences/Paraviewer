[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "paraviewer"
version = "1.0.0"
description = "command line tool for generating visualizations of outputs from the Paraphase variant caller"
readme = "readme.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [
    { name = "Jonathan Belyeu", email = "jbelyeu@pacificbiosciences.com" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "License :: Other/Proprietary License",
]
dependencies = [
    "Jinja2==3.1.6",
    "cachetools==5.5.2",
    "pysam==0.23.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.5",
    "pytest-cov",
    "black",
    "isort",
    "mypy",
    "ruff",
    "pre-commit",
    "scikit-image>=0.24.0",
]

[project.scripts]
paraviewer = "paraviewer.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["paraviewer"]

[tool.hatch.build.targets.sdist]
include = [
    "paraviewer",
    "LICENSE",
    "readme.md",
]

# Pixi: conda (orographer) + PyPI (paraviewer and deps). E2E: pixi run e2e
[tool.pixi.workspace]
channels = ["conda-forge", "bioconda"]
platforms = ["linux-64", "osx-arm64", "osx-64"]

[tool.pixi.dependencies]
orographer = "==0.1.0"

[tool.pixi.pypi-dependencies]
paraviewer = { path = ".", editable = true }

[tool.pixi.environments]
default = { features = ["dev"], solve-group = "default" }

[tool.pixi.tasks]
e2e = "bash tests/scripts/run_end_to_end_tests.sh"

[tool.hatch.envs.default]
dependencies = [
    "pytest",
    "pytest-cov",
]

[tool.hatch.envs.default.scripts]
test = "pytest {args:tests}"
test-cov = "pytest --cov=paraviewer --cov-config=pyproject.toml --cov-report=term-missing:skip-covered --cov-report=xml:coverage.xml {args:tests}"
cov-html = "pytest --cov=paraviewer --cov-config=pyproject.toml --cov-report=html {args:tests}"
lint = [
    "black --check .",
    "isort --check-only .",
    "mypy .",
    "ruff check .",
]
format = [
    "black .",
    "isort .",
    "ruff check --fix .",
]

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.isort]
profile = "black"
multi_line_output = 3

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "B", "I"]
ignore = []

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-ra --tb=short --strict-markers"
markers = [
    "unit: fast unit tests under tests/unit/",
    "integration: integration tests",
    "slow: slow-running tests",
    "layer_pure: deterministic, no FS/subprocess (plan §4)",
    "layer_io: fixture / tmp_path I/O (plan §4)",
    "layer_orchestration: paraviewer() pipeline (plan §4)",
]

# Coverage gate (§2 unit_test_plan.md): raise fail_under as the suite grows.
[tool.coverage.run]
source = ["paraviewer"]
relative_files = true

[tool.coverage.report]
fail_under = 60
precision = 1
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == \"__main__\":",
]

[tool.coverage.html]
directory = "htmlcov"